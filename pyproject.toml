[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdu"
version = "2.1.0"
description = "Procesador universal de documentos: diagramas Mermaid, LaTeX y Markdown a PDF."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "markdown",
    "weasyprint",
    "ziamath",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
pdu = "pdu.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdu", "pdu.*"]
exclude = ["pdu.tests", "pdu.tests.*", "tests", "tests.*"]

[tool.setuptools.package-data]
"pdu.markdown" = ["estilos/*.css"]
